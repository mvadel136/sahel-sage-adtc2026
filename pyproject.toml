[project]
name = "sahel-sage"
version = "0.1.0"
description = "Sahel Sage — offline, evidence-cited agricultural advisor for the Sahel (ADTC 2026 Laptop LLM Challenge)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
data = ["pypdf>=4"]
app = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "fastapi>=0.110",  # tests/smoke drives the console through TestClient
    "jinja2>=3.1",  # verifies the GGUF chat template against render_raw
    "uvicorn>=0.29",  # `sage app run` — the end-to-end check needs a real server
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
sage = "sahel_sage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sahel_sage"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "RUF"]
ignore = ["E501"]  # line length handled by the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/sahel_sage"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "psutil>=7.2.2",
    "tokenizers>=0.23.1",
]

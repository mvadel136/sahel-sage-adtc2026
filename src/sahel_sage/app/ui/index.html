<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahel Sage — offline farm advisor</title>
<style>
  /* One self-contained file: the console must open with no network, no CDN,
     no font fetch. Designed to read in daylight on a cheap laptop, and to be
     recognisable in five seconds as an AI advisor you can talk to. */
  :root{
    --sand:#f2ecdf; --ink:#221a10; --muted:#6a5c4a; --line:#ddd2bd;
    --acacia:#3c6a44; --acacia-deep:#2e5236; --acacia-dim:#e4ecdf;
    --clay:#a84b26; --clay-dim:#f3e4dc; --sun:#b07d20; --card:#fbf7ee;
    --radius:14px; --radius-sm:10px;
    --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --sand:#161209; --ink:#efe7d8; --muted:#a3937d; --line:#332b1e;
           --acacia:#8cbc93; --acacia-deep:#a9d0af; --acacia-dim:#20291f;
           --clay:#e08a5c; --clay-dim:#2b2018; --sun:#d8a13a; --card:#1e1911; }
  }
  *{box-sizing:border-box}
  :focus-visible{outline:2px solid var(--acacia);outline-offset:2px}
  body{margin:0;background:var(--sand);color:var(--ink);
       font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}

  /* ---------------- header ---------------- */
  header{display:flex;align-items:center;gap:.6rem;height:52px;
         padding:0 16px;border-bottom:1px solid var(--line);
         background:var(--card);position:sticky;top:0;z-index:5}
  .mark{width:24px;height:24px;flex:0 0 auto;color:var(--acacia)}
  h1{font:600 17px/1 var(--serif);margin:0;letter-spacing:.01em}
  .spacer{flex:1}
  .pill{display:flex;align-items:center;gap:.45rem;font-size:13px;color:var(--muted)}
  .pill::before{content:"";width:8px;height:8px;border-radius:50%;
                background:var(--sun);animation:pulse 1.6s ease-in-out infinite}
  .pill.ok::before{background:var(--acacia);animation:none}
  .pill.ok{color:var(--acacia)}
  @keyframes pulse{50%{opacity:.35}}

  /* ---------------- page ---------------- */
  main{max-width:720px;margin:0 auto;padding:16px 16px 132px}

  /* welcome: the five-second first impression */
  #welcome{text-align:center;padding:48px 8px 24px}
  #welcome .mark{width:44px;height:44px}
  #welcome h2{font:600 28px/1.2 var(--serif);margin:12px 0 8px}
  #welcome .promise{color:var(--muted);margin:0 0 32px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;
           text-transform:uppercase;color:var(--muted)}
  .chips{display:flex;flex-direction:column;gap:8px;margin-top:8px;text-align:left}
  .chip{font:inherit;text-align:left;width:100%;cursor:pointer;
        background:var(--card);border:1px solid var(--line);color:var(--ink);
        border-radius:var(--radius-sm);padding:10px 14px}
  .chip::before{content:"›";color:var(--acacia);font-weight:700;margin-right:.5rem}
  .chip:hover,.chip:focus-visible{border-color:var(--acacia)}

  /* ---------------- conversation ---------------- */
  .turn{margin-top:24px}
  .q{margin-left:auto;max-width:80%;width:fit-content;
     background:var(--acacia-dim);border-radius:14px 14px 4px 14px;
     padding:10px 14px;margin-bottom:12px;white-space:pre-wrap}
  .who{display:flex;align-items:center;gap:.45rem;font-size:13.5px;
       font-weight:600;margin-bottom:6px}
  .who svg{width:18px;height:18px;color:var(--acacia)}
  .answer{background:var(--card);border:1px solid var(--line);
          border-left:3px solid var(--acacia);border-radius:var(--radius);
          padding:16px}
  .answer.with-sources{border-radius:var(--radius) var(--radius) 0 0}
  .answer.unsourced{border-left-color:var(--sun)}
  .turn.refused .answer{border-left-color:var(--clay)}
  .sec{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;
       text-transform:uppercase;color:var(--acacia);margin:16px 0 4px}
  .sec:first-child{margin-top:0}
  .sec.caution{color:var(--clay)}
  .answer p{margin:4px 0;white-space:pre-wrap}
  .answer ol{margin:4px 0 4px 22px;padding:0}
  .answer ol li{margin:5px 0}
  .cite{display:inline-block;min-width:1.35em;text-align:center;font-size:12px;
        vertical-align:super;color:#fff;background:var(--acacia);border-radius:4px;
        padding:0 .25em;margin:0 .12em;cursor:pointer;text-decoration:none}
  .caret{display:inline-block;width:.55em;height:1.05em;vertical-align:-0.15em;
         background:var(--acacia);opacity:.7;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* waiting, inside the answer where the eyes already are */
  .wait{display:flex;align-items:center;gap:.6rem;color:var(--muted);font-size:14px}
  .wait i{width:6px;height:6px;border-radius:50%;background:var(--acacia);
          animation:dots 1.2s ease-in-out infinite}
  .wait i:nth-child(2){animation-delay:.2s}
  .wait i:nth-child(3){animation-delay:.4s}
  @keyframes dots{40%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){
    .caret,.wait i,.pill::before{animation:none}
    .wait i{opacity:.6}
  }

  /* sources: the product's signature, fused to the answer as a tinted band */
  .sources:not(:empty){background:var(--acacia-dim);border:1px solid var(--line);
           border-top:0;border-radius:0 0 var(--radius) var(--radius);
           padding:12px 16px;font-size:.9rem}
  .turn.refused .sources:not(:empty){background:var(--clay-dim)}
  .srchead{font-size:12px;font-weight:700;letter-spacing:.08em;
           text-transform:uppercase;color:var(--acacia);margin:0 0 2px}
  .srchead.near{color:var(--clay)}
  .src{border:1px solid var(--line);border-radius:var(--radius-sm);
       background:var(--card);padding:8px 12px;margin-top:8px}
  .src summary{cursor:pointer;color:var(--muted);display:flex;gap:.5rem;
               align-items:baseline;list-style:none}
  .src summary::-webkit-details-marker{display:none}
  .src summary::after{content:"▸";margin-left:auto;color:var(--muted);
                      transition:transform .15s}
  .src[open] summary::after{transform:rotate(90deg)}
  .src summary b{color:var(--ink);font-weight:600;font-size:15px}
  .src .n{flex:0 0 auto;min-width:1.45em;text-align:center;font-size:12px;
          color:#fff;background:var(--acacia);border-radius:4px;padding:.05em .25em}
  .src[open]{border-color:var(--acacia)}
  .src p{margin:8px 0 0;color:var(--muted);font-size:.85rem;white-space:pre-wrap}
  .meta{color:var(--muted);font-size:12px;margin-top:6px}
  .warn{color:var(--clay)}

  /* ---------------- input bar ---------------- */
  .askbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);
          border-top:1px solid var(--line);padding:10px 16px 6px;z-index:5}
  .ask{display:flex;gap:8px;align-items:flex-end;max-width:720px;margin:0 auto;
       background:var(--sand);border:1.5px solid var(--line);border-radius:24px;
       padding:8px 8px 8px 16px}
  .ask:focus-within{border-color:var(--acacia);
                    box-shadow:0 0 0 3px var(--acacia-dim)}
  textarea{flex:1;border:0;background:transparent;color:inherit;resize:none;
           font:inherit;min-height:1.6em;max-height:144px;outline:none;padding:6px 0}
  #send{flex:0 0 auto;width:40px;height:40px;border:0;border-radius:50%;
        background:var(--acacia);color:#fff;cursor:pointer;display:flex;
        align-items:center;justify-content:center;padding:0}
  #send:hover{background:var(--acacia-deep)}
  #send:disabled{opacity:.55;cursor:default}
  #send .stop{display:none;width:12px;height:12px;background:#fff;border-radius:2px}
  #send.busy .arrow{display:none}
  #send.busy .stop{display:block}
  .statusline{max-width:720px;margin:6px auto 0;font-size:12px;
              color:var(--muted);text-align:center}
  .hint{display:none}
  @media (min-width:700px){.hint{display:inline}}
</style>
</head>
<body>
<header>
  <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round">
    <path d="M12 21V11"/><path d="M4 8h16"/><path d="M6 8c0-2.5 2.7-4 6-4s6 1.5 6 4"/>
    <path d="M12 11c-2 1.5-4 2-6 2"/><path d="M12 14c2 1.5 4 2 6 2"/>
  </svg>
  <h1>Sahel Sage</h1>
  <span class="spacer"></span>
  <span class="pill" id="statusPill">starting the model…</span>
</header>

<main>
  <div id="welcome">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round">
      <path d="M12 21V11"/><path d="M4 8h16"/><path d="M6 8c0-2.5 2.7-4 6-4s6 1.5 6 4"/>
      <path d="M12 11c-2 1.5-4 2-6 2"/><path d="M12 14c2 1.5 4 2 6 2"/>
    </svg>
    <h2>Sahel Sage</h2>
    <p class="promise">Field advice for crops and herds, from real manuals — no internet needed.</p>
    <div class="eyebrow">Try one of these</div>
    <div class="chips" id="examples"></div>
  </div>
  <div id="feed"></div>
</main>

<div class="askbar">
  <div class="ask">
    <textarea id="q" rows="1" placeholder="Describe the problem: crop or animal, what you see…" aria-label="Your question"></textarea>
    <button id="send" aria-label="Ask">
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V6"/><path d="M6 12l6-6 6 6"/>
      </svg>
      <span class="stop"></span>
    </button>
  </div>
  <div class="statusline" id="libInfo" title="">library —<span class="hint"> · Enter to ask, Shift+Enter for a new line</span></div>
</div>

<script>
/* Every example below is MEASURED to answer through the full pipeline
   (retrieval gate + numeric gate + contract parse) — an example chip that
   gets refused teaches the user the tool is broken. English only: it is the
   declared language scope of the submission, and offering an unmeasured
   language is a promise the model has not earned. */
const EXAMPLES =
  ["My goats have watery diarrhea and stopped eating. What should I do?",
   "Fall armyworm in my maize — no money for pesticide",
   "I have just harvested my maize and I want to store it for the dry season without weevils eating it. What should I do, and what should I avoid?",
   "My chickens are dying suddenly. How do I protect the flock?",
   "Salt patches appearing on my irrigated plot"];
const $ = s => document.querySelector(s);
const feed = $("#feed");
const WHO_SVG = document.querySelector("header .mark").outerHTML;
let busy = false, lastCitations = [];

function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function renderExamples(){
  $("#examples").innerHTML = "";
  EXAMPLES.forEach(t => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = t;
    b.onclick = () => { $("#q").value = t; ask(); };
    $("#examples").appendChild(b);
  });
}

let ready = false;
async function loadStatus(){
  try{
    const s = await (await fetch("/api/status")).json();
    ready = true;
    $("#statusPill").textContent = "Ready · works without internet";
    $("#statusPill").className = "pill ok";
    const lib = s.library || {};
    $("#libInfo").firstChild.textContent = lib.documents
      ? `Answers come from ${lib.documents} manuals stored on this computer`
      : "Library empty — answers are unsourced";
    $("#libInfo").title =
      `model ${s.model} · ${s.model_size_mb} MB · ${s.threads} threads · ${lib.chunks || 0} passages`;
  }catch(e){
    ready = false;
    $("#statusPill").textContent = "starting the model…";
    $("#statusPill").className = "pill";
    setTimeout(loadStatus, 2000);   // the model takes a moment to load; keep watching
  }
}

/* Render the answer contract as structure, live during streaming: the
   section names become quiet uppercase eyebrows, numbered steps a real list,
   "[2]" a chip that opens source card 2. Everything is escaped BEFORE any
   markup is added, so model output can never inject HTML. */
const SEC_RE = /\*\*\s*(Likely issue|What to do|Timing|Caution|Sources)\s*\*\*:?/gi;
function formatAnswer(raw, id, streaming){
  let t = esc(raw);
  t = t.replace(SEC_RE, (m, name) =>
    `\u0000sec:${name.toLowerCase()==="caution" ? "caution" : "plain"}:${name}\u0000`);
  const parts = t.split("\u0000").filter(Boolean);
  let html = "", listOpen = false;
  const closeList = () => { if (listOpen){ html += "</ol>"; listOpen = false; } };
  for (const part of parts){
    if (part.startsWith("sec:")){
      closeList();
      const seg = part.split(":");
      html += `<span class="sec ${seg[1]==="caution"?"caution":""}">${seg[2]}</span>`;
      continue;
    }
    for (const line of part.split("\n")){
      const m = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (m){
        if (!listOpen){ html += "<ol>"; listOpen = true; }
        html += `<li>${m[1]}</li>`;
      } else if (line.trim()){
        closeList();
        html += `<p>${line}</p>`;
      }
    }
  }
  closeList();
  html = html.replace(/\[(\d{1,2})\]/g,
    (m, n) => `<a class="cite" href="#" data-turn="${id}" data-n="${n}">${n}</a>`);
  if (streaming) html += `<span class="caret"></span>`;
  return html;
}
function wireCitations(el){
  el.querySelectorAll(".cite").forEach(a => a.onclick = ev => {
    ev.preventDefault();
    const d = document.getElementById(a.dataset.turn + "-src-" + a.dataset.n);
    if (d){ d.open = true; d.scrollIntoView({behavior:"smooth", block:"center"}); }
  });
}

function setBusy(b){
  busy = b;
  $("#send").disabled = b;
  $("#send").classList.toggle("busy", b);
  $("#q").disabled = b;
  document.querySelectorAll(".chip").forEach(c => c.disabled = b);
}

function ask(){
  if (busy) return;
  if (!ready){ loadStatus(); return; }
  const question = $("#q").value.trim();
  if (question.length < 3) return;
  document.getElementById("welcome")?.remove();
  setBusy(true);
  const id = "t" + Date.now();
  const turn = document.createElement("section");
  turn.className = "turn";
  turn.innerHTML = `<div class="q">${esc(question)}</div>
    <div class="who">${WHO_SVG}Sahel Sage</div>
    <div class="answer" id="${id}-a">
      <div class="wait" id="${id}-wait"><i></i><i></i><i></i>
        <span id="${id}-stage">searching the offline library…</span></div>
    </div>
    <div class="sources" id="${id}-s"></div>
    <div class="meta" id="${id}-m"></div>`;
  feed.appendChild(turn);        // a conversation reads downward
  $("#q").value = ""; $("#q").style.height = "auto";
  turn.scrollIntoView({behavior:"smooth", block:"start"});

  const ansEl = document.getElementById(id + "-a");
  const metaEl = document.getElementById(id + "-m");
  let buffer = "";

  // The first token can take a while on 4 CPU cores: the model must read the
  // retrieved passages before it writes a word. Show honest progress with a
  // clock, not a frozen label — a farmer (or a judge) must never wonder
  // whether the machine died.
  const t0 = Date.now();
  let stage = "searching the offline library";
  const tick = setInterval(() => {
    if (buffer) return;               // tokens flowing — the wait row is gone
    const el = Math.round((Date.now() - t0) / 1000);
    const st = document.getElementById(id + "-stage");
    if (st) st.textContent = `${stage}… ${el}s` +
      (el > 12 ? "  (reading the manuals before answering — the first answer is the slowest)" : "");
  }, 500);

  fetch("/api/ask", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({question, lang: "en"})
  }).then(async res => {
    if (!res.ok){
      let msg = `server error ${res.status}`;
      try { msg = (await res.json()).detail || msg; } catch(e){}
      throw new Error(msg);
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let carry = "";
    for(;;){
      const {value, done} = await reader.read();
      if (done) break;
      carry += dec.decode(value, {stream:true});
      const frames = carry.split("\n\n"); carry = frames.pop();
      for (const frame of frames){
        const ev = (frame.match(/^event: (.+)$/m) || [])[1];
        const dataLine = (frame.match(/^data: (.+)$/m) || [])[1];
        if (!ev || !dataLine) continue;
        const data = JSON.parse(dataLine);
        if (ev === "citations"){ renderSources(id, data.citations, ansEl); stage = "reading the manuals, writing the answer"; }
        else if (ev === "contract"){
          if (data.status && data.status !== "ANSWERED") markRefused(id, turn);
        }
        else if (ev === "token"){
          buffer += data.t;
          ansEl.innerHTML = formatAnswer(buffer, id, true);
          const nearBottom = innerHeight + scrollY >= document.body.scrollHeight - 260;
          if (nearBottom) scrollTo({top: document.body.scrollHeight});
        }
        else if (ev === "error"){
          metaEl.innerHTML = `<span class="warn">error: ${esc(data.message)}</span>`;
        } else if (ev === "done"){
          ansEl.innerHTML = formatAnswer(buffer, id, false);
          wireCitations(ansEl);
          metaEl.textContent = `Answered in ${data.seconds}s · offline`;
          metaEl.title = `${data.tokens} tokens · ${data.tps} tok/s`;
        }
      }
    }
  }).catch(e => {
    metaEl.innerHTML = `<span class="warn">${esc(e.message)} — is the model still loading? The dot at the top shows its state.</span>`;
  }).finally(() => { clearInterval(tick); setBusy(false); });
}

function renderSources(id, citations, ansEl){
  lastCitations = citations || [];
  const box = document.getElementById(id + "-s");
  if (!citations || !citations.length){
    ansEl.classList.add("unsourced");
    box.innerHTML = `<div class="meta warn">No manual in the offline library matched
      this question — the answer below comes from the model alone.</div>`;
    return;
  }
  ansEl.classList.add("with-sources");
  box.innerHTML = `<div class="srchead" id="${id}-sh">From the offline library · ${citations.length} manuals</div>` +
    citations.map((c, i) => `
    <details class="src" id="${id}-src-${i+1}">
      <summary><span class="n">${i+1}</span><b>${esc(c.title)}</b>&nbsp;— ${esc(c.org)}</summary>
      <p>${esc(c.text)}</p>
    </details>`).join("");
}

/* When the pipeline declines, the passages shown are the NEAREST matches, not
   the answer's evidence. Say so, or a refusal looks like a malfunction. */
function markRefused(id, turn){
  turn?.classList.add("refused");
  const h = document.getElementById(id + "-sh");
  if (h){ h.textContent = "Nearest passages — not close enough to answer from"; h.classList.add("near"); }
}

$("#send").onclick = ask;
$("#q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask(); }
});
$("#q").addEventListener("input", () => {
  const q = $("#q");
  q.style.height = "auto";
  q.style.height = Math.min(q.scrollHeight, 144) + "px";
});
renderExamples(); loadStatus();
</script>
</body>
</html>
